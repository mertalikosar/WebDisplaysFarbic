name: Build mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle kendisi Java 21 üzerinde çalışacak (major version 69 çökmesini engeller)
      - name: Set up JDK 21 (for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Minecraft 26.2 derlemesi için Java 25 kuruluyor
      - name: Set up JDK 25 (for Minecraft 26.2)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdisplays-mod-jar
          path: build/libs/*.jar
