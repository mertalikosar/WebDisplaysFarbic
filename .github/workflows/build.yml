name: Build mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Java 21 kurulumu (Gradle çalıştırmak için)
      - name: Set up JDK 21 (for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. Java 25 kurulumu (Minecraft 26.2 derlemesi için)
      - name: Set up JDK 25 (for Minecraft 26.2)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # JAVA_HOME değişkenini açıkça Java 21 yoluna yönlendiriyoruz
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        env:
          JAVA_HOME: ${{ steps.setup-java-21.outputs.path }}
